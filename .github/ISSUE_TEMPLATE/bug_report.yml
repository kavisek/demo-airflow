name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Airflow version and OS
      placeholder: e.g. 3.3.2 on macOS 15, Docker Desktop 4.40
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
